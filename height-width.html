<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height dan Width</title>
    <style>
        div h5{
            height: 200px;
            width: 200px;
            padding: 20px;
            border: 2px solid black;
            margin: 10px;
        }

        div h4 {
            height: 200px;
            width: 200px;
            overflow: hidden;
            border: 2px solid black;
        }

        div h3 {
            height: 200px;
            width: 200px;
            overflow: auto;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div>
        <h5>Kimda Yudha Pratama</h5>
    </div>
    <div>
        <h4>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ipsam, voluptate.</h4>
    </div>
    <div>
        <h3>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ab vel nisi magni nostrum fugiat, culpa alias ut rem aspernatur recusandae ducimus ex totam quod assumenda labore, nemo vero beatae in?</h3>
    </div>
</body>
</html>
